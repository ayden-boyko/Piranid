# Scrape configuration for the observability components.
#
# Each config is projected from a ConfigMap by manifests/logging-deployment.yaml.
# Keeping them here as well as under nodes/Logging/ means the manifests can be
# applied without the compose tree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: piranid
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }

    processors:
      # memory_limiter is added ahead of batch. Without it a spike in telemetry
      # can OOM the collector, and on a Pi that takes down the node it runs on
      # rather than just the collector.
      memory_limiter:
        check_interval: 2s
        limit_percentage: 75
        spike_limit_percentage: 20
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      otlp/tempo:
        endpoint: tempo:4417
        tls: { insecure: true }
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
      prometheus:
        endpoint: 0.0.0.0:8889

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [loki]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: piranid
data:
  config.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100 }
    ingester:
      lifecycler.ring: { kvstore: { store: inmemory } }
      replication_factor: 1
      chunk_idle_period: 5m
      chunk_retain_period: 30s
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
      filesystem: { directory: /loki/chunks }
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # A hard cap, because reject_old_samples alone still let a high-volume
      # node grow without bound inside the window.
      retention_period: 168h
      max_cache_freshness_per_second: 1.0
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: piranid
data:
  config.yaml: |
    server: { http_listen_port: 3200 }
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4417 }
            http: { endpoint: 0.0.0.0:4418 }
    storage:
      trace:
        backend: local
        local: { path: /tempo/traces }
        wal: { path: /tempo/wal }
    compactor:
      compaction:
        block_retention: 168h
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: piranid
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs: [ { targets: ["localhost:9090"] } ]
      - job_name: otel-collector
        static_configs: [ { targets: ["otel-collector:8889"] } ]
      # Service metrics all arrive through the collector, so the collector is a
      # single point of failure for observability. Scrape the services directly
      # as well: an independent signal that a service is actually up is what
      # makes a collector outage diagnosable rather than mysterious.
      - job_name: piranid-services
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (auth|event-queue|notifications)
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: piranid
data:
  config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      # On a volume, not /tmp. On the container writable layer a restart lost
      # tail positions and re-shipped recent logs.
      filename: /var/lib/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      # Piranid runs on containerd, where /var/run/docker.sock does not exist.
      # The previous docker_sd_configs setup therefore discovered no containers
      # and shipped nothing. This reads the runtime's log directory instead.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Container log lines are CRI-formatted:
          #   2024-01-01T00:00:00.000000000Z stdout F {"level":"info",...}
          - cri: {}
          - json:
              expressions:
                level: level
                msg: msg
                service: service
                timestamp: ts
          - labels:
              level:
              service:
          - timestamp:
              source: timestamp
              format: "2006-01-02T15:04:05.999999999Z07:00"
              location: America/Vancouver
          - output:
              source: __line__
          - labelallow:
              - __log__
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: piranid
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        jsonData:
          # Only works if log lines carry a trace id. Every service now derives
          # its spans from the request context and calls WithTraceID.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
            filterBySpanID: true
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true