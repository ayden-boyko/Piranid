# Observability stack.
#
# The previous manifest declared a single container named "logging" with an
# image "piranid-logging" that nothing builds, and port numbers that contradicted
# themselves (containerPort 8084, service target 8083, env 8083). There is no
# application to run: this is six separate stateful components.
#
# Each component therefore gets its own Deployment and Service. The OTLP
# collector is the only one the application services depend on; it must be
# scheduled before they start, or they will log export failures until it is up.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: piranid
  labels: { app: loki, component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki, component: observability }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          args: ["-config.file=/etc/loki/config.yaml"]
          ports:
            - { name: http, containerPort: 3100 }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "512Mi", cpu: "300m" }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: piranid
spec:
  selector: { app: loki }
  ports:
    - { name: http, port: 3100, targetPort: 3100 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: piranid
  labels: { app: tempo, component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo, component: observability }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2
          args: ["-config.file=/etc/tempo/config.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            # The collector exports OTLP/gRPC to 4417.
            - { name: otlp-grpc, containerPort: 4417 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /tempo }
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "512Mi", cpu: "300m" }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          persistentVolumeClaim: { claimName: tempo-data }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: piranid
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: 3200 }
    - { name: otlp-grpc, port: 4417, targetPort: 4417 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: piranid
  labels: { app: prometheus, component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus, component: observability }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            # Unbounded TSDB growth on a fixed-size SD card was a known gap.
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=512MB
          ports:
            - { name: http, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "512Mi", cpu: "300m" }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: piranid
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: piranid
  labels: { app: otel-collector, component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector, component: observability }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8889 }
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
          livenessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "200m" }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: piranid
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: metrics, port: 8889, targetPort: 8889 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: piranid
  labels: { app: promtail, component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app: promtail }
  template:
    metadata:
      labels: { app: promtail, component: observability }
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.4.2
          args: ["-config.file=/etc/promtail/config.yaml"]
          ports:
            - { name: http, containerPort: 9080 }
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            # Container runtime logs. Piranid runs on containerd, where
            # /var/run/docker.sock does not exist, so the previous
            # docker_sd_configs setup found nothing.
            - { name: varlog, mountPath: /var/log, readOnly: true }
            # Positions on a volume, so a restart does not re-ship every log line.
            - { name: positions, mountPath: /var/lib/promtail }
          resources:
            requests: { memory: "32Mi", cpu: "20m" }
            limits: { memory: "128Mi", cpu: "100m" }
      volumes:
        - name: config
          configMap: { name: promtail-config }
        - name: varlog
          hostPath: { path: /var/log, type: Directory }
        - name: positions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: piranid
spec:
  selector: { app: promtail }
  ports:
    - { name: http, port: 9080, targetPort: 9080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: piranid
  labels: { app: grafana, component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana, component: observability }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.1
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # Credentials from a Secret rather than the compose default
            # admin/admin.
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: user }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: password }
            # Anonymous access was disabled so a dashboard is not world-readable.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "http://grafana.piranid.local:3000"
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning }
            - { name: data, mountPath: /var/lib/grafana }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "200m" }
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: piranid
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }