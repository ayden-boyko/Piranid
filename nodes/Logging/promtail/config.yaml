# Promtail for the DOCKER compose stack.
#
# This file scrapes the Docker socket, which is correct here because compose runs
# these containers under Docker.
#
# It does NOT work on the Kubernetes cluster: Piranid uses containerd, where
# /var/run/docker.sock does not exist, so this configuration discovers no
# containers. The in-cluster equivalent reads /var/log/containers through a
# filelog/kubernetes_sd setup and is defined in
# manifests/logging-config.yaml (ConfigMap promtail-config).
#
# Positions live on /tmp here, so a restart re-ships recent logs. The
# Kubernetes variant mounts a volume for the same reason.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
